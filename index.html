2<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Tetris</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="game-area" aria-label="Tetris game">
      <div class="board-wrap">
        <canvas id="gameCanvas" width="320" height="640" aria-label="Tetris board"></canvas>
        <div id="overlay" class="overlay hidden">
          <div class="overlay-panel">
            <h1 id="overlayTitle">Paused</h1>
            <p id="overlayText">Press P or Escape to resume.</p>
            <button id="overlayRestart" type="button">Restart</button>
          </div>
        </div>
      </div>

      <div class="mobile-controls" aria-label="Touch control hints">
        <span>SWIPE</span>
        <span>TAP</span>
        <span>DROP</span>
      </div>
    </section>

    <aside class="side-panel" aria-label="Game information">
      <header class="title-block">
        <p class="word-box word-box-dark">READY</p>
        <p class="word-box">PLAYER</p>
        <p class="word-box word-box-dark">ONE</p>
      </header>

      <section class="stats-grid" aria-label="Stats">
        <div>
          <span>SCORE</span>
          <strong id="score">0</strong>
        </div>
        <div>
          <span>LEVEL</span>
          <strong id="level">1</strong>
        </div>
        <div>
          <span>LINES</span>
          <strong id="lines">0</strong>
        </div>
      </section>

      <section class="preview-grid">
        <div class="preview-card">
          <h2>NEXT</h2>
          <canvas id="nextCanvas" width="128" height="128" aria-label="Next piece preview"></canvas>
        </div>
        <div class="preview-card">
          <h2>HOLD</h2>
          <canvas id="holdCanvas" width="128" height="128" aria-label="Held piece preview"></canvas>
        </div>
      </section>

      <section class="controls-card">
        <h2>CONTROL</h2>
        <dl>
          <div><dt>MOVE</dt><dd>LEFT / RIGHT</dd></div>
          <div><dt>SOFT</dt><dd>DOWN</dd></div>
          <div><dt>TURN</dt><dd>UP / X</dd></div>
          <div><dt>DROP</dt><dd>SPACE</dd></div>
          <div><dt>HOLD</dt><dd>C</dd></div>
          <div><dt>STOP</dt><dd>P / ESC</dd></div>
        </dl>
      </section>

      <section class="actions-row">
        <label for="themeSelect">MODE</label>
        <select id="themeSelect" aria-label="Theme selector">
          <option value="gameboy">VECTOR BOY</option>
        </select>
        <button id="restartButton" type="button">RESET</button>
      </section>

      <section class="leaderboard-card">
        <div class="section-title">
          <h2>RANK</h2>
          <button id="clearLeaderboard" type="button">CLEAR</button>
        </div>
        <ol id="leaderboard"></ol>
      </section>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
